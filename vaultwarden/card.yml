apiVersion: v1
kind: Card
metadata:
  name: vaultwarden
  description: Vaultwarden, a Bitwarden-compatible password server, for your own apps and browsers

applications:
  - name: vaultwarden
    what: Vaultwarden, for Bitwarden apps and the web vault
    from: vaultwarden/server:1.37.4
    port: 8222
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: vaultwarden
